<script>
        // Kinetic Slider Logic
        const handle = document.getElementById('slider-handle');
        const track = document.getElementById('slider-root');
        const progress = document.getElementById('slider-bg-progress');
        let isDragging = false;
        let startX = 0;
        let currentX = 0;

        const onStart = (e) => {
            isDragging = true;
            startX = (e.touches ? e.touches[0].clientX : e.clientX) - currentX;
            handle.style.transition = 'none';
            progress.style.transition = 'none';
        };

        const onMove = (e) => {
            if (!isDragging) return;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const maxDrag = track.offsetWidth - handle.offsetWidth - 16;
            let x = clientX - startX;
            
            x = Math.max(0, Math.min(x, maxDrag));
            currentX = x;
            
            handle.style.transform = `translateX(${x}px)`;
            progress.style.width = `${x + handle.offsetWidth}px`;

            // Visual feedback on completion
            if (x >= maxDrag * 0.95) {
                handle.style.backgroundColor = '#EF4444'; // Red feedback
            } else {
                handle.style.backgroundColor = '#FFFFFF';
            }
        };

        const onEnd = () => {
            if (!isDragging) return;
            isDragging = false;
            const maxDrag = track.offsetWidth - handle.offsetWidth - 16;

            if (currentX >= maxDrag * 0.9) {
                // Success State
                currentX = maxDrag;
                handle.style.transform = `translateX(${maxDrag}px)`;
                progress.style.width = `100%`;
                
                // Simulated Haptic & Success Redirect
                handle.classList.add('scale-90');
                setTimeout(() => {
                    document.body.style.opacity = '0.5';
                    console.log("SPARK LOCKED: INITIATING PROTOCOL");
                }, 200);
            } else {
                // Reset
                currentX = 0;
                handle.style.transition = 'transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), background-color 0.2s';
                progress.style.transition = 'width 0.3s cubic-bezier(0.34, 1.56, 0.64, 1)';
                handle.style.transform = `translateX(0px)`;
                handle.style.backgroundColor = '#FFFFFF';
                progress.style.width = `0px`;
            }
        };

        handle.addEventListener('mousedown', onStart);
        handle.addEventListener('touchstart', onStart);
        window.addEventListener('mousemove', onMove);
        window.addEventListener('touchmove', onMove);
        window.addEventListener('mouseup', onEnd);
        window.addEventListener('touchend', onEnd);

        // Input Focus Visuals
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.previousElementSibling.classList.replace('text-zinc-400', 'text-surgical-white');
            });
            input.addEventListener('blur', () => {
                input.parentElement.previousElementSibling.classList.replace('text-surgical-white', 'text-zinc-400');
            });
        });
    </script>
