<!-- Kinetic Feedback Logic -->
<script>
        document.getElementById('kinetic-slider').addEventListener('click', function() {
            if (navigator.vibrate) {
                navigator.vibrate([30, 50, 30]);
            }

            const flash = document.createElement('div');
            flash.className = 'fixed inset-0 bg-white z-[9999] pointer-events-none opacity-0 transition-opacity duration-150 ease-out';
            document.body.appendChild(flash);

            requestAnimationFrame(() => {
                flash.style.opacity = '0.9';
                setTimeout(() => {
                    flash.style.opacity = '0';
                    setTimeout(() => {
                        flash.remove();
                    }, 150);
                }, 50);
            });
        });
    </script>
