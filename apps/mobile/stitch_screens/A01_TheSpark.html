<style>
        body {
            background-color: #000000;
            color: #ffffff;
            cursor: crosshair;
        }
        
        .hud-border {
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .vertical-text {
            writing-mode: vertical-rl;
            text-orientation: mixed;
        }

        .crosshair-h {
            width: 100%;
            height: 1px;
            background: rgba(255,255,255,0.1);
            position: absolute;
            left: 0;
            top: 50%;
        }

        .crosshair-v {
            width: 1px;
            height: 100%;
            background: rgba(255,255,255,0.1);
            position: absolute;
            top: 0;
            left: 50%;
        }
        
        .scan-effect {
            background: linear-gradient(to bottom, transparent 0%, rgba(255,255,255,0.05) 50%, transparent 100%);
            height: 100px;
            position: absolute;
            width: 100%;
            z-index: 5;
            pointer-events: none;
        }
    </style>
</head>

<!-- Frame Corners -->

<div class="absolute bottom-4 left-4 w-12 h-12 border-b-2 border-l-2 border-white"></div>
<div class="absolute bottom-4 right-4 w-12 h-12 border-b-2 border-r-2 border-white"></div>
</div>
<!-- Top Telemetry Header -->
<!-- Side Data Streams -->
<!-- Central Branding -->
<main class="flex-1 relative z-20 flex flex-col items-center justify-center px-margin-mobile pb-24">
<div class="text-center animate-fade-in">
<h1 class="font-headline-lg text-[48px] text-white tracking-[0.4em] mb-2 leading-none">FORGE</h1>
<div class="w-full h-px bg-white/30 mb-6"></div><p class="font-label-caps text-white/60 text-[10px] tracking-[0.3em] mt-2">BIOMECHANICAL SIMULATION ENGINE</p>
</div>
<!-- Metadata Cluster -->
</main>
<!-- Fixed Glass Footer -->

<div class="max-w-md mx-auto flex flex-col items-center gap-6">

                INITIATE EVALUATION
                

</button>
<!-- Secondary Action -->

</footer>
<!-- Bottom Corner Telemetry -->
<div class="absolute bottom-margin-mobile left-margin-mobile z-40 pointer-events-none hidden md:block">
<div class="font-label-caps text-zinc-400">UPLINK: SECURE</div>
</div>
<script>
        function triggerHaptic() {
            if (navigator.vibrate) {
                navigator.vibrate([20, 10, 20]);
            }
            console.log("Evaluation Initiated");
        }

        // Random matrix-like text flickering
        const telemetryElements = document.querySelectorAll('.animate-data-flicker');
        setInterval(() => {
            telemetryElements.forEach(el => {
                if(Math.random() > 0.95) {
                    const original = el.innerText;
                    el.innerText = "OVERRIDE_0x" + Math.floor(Math.random()*1000).toString(16);
                    setTimeout(() => el.innerText = original, 100);
                }
            });
        }, 500);
    </script>
</body></html>
