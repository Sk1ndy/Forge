<body class="min-h-screen flex flex-col font-body-md overflow-x-hidden selection:bg-chirurgical-red selection:text-white">

<!-- Theoretical Impact HUD -->
<section class="glass-panel p-6 rounded-lg flex flex-col gap-4 relative overflow-hidden">
<div class="absolute top-0 left-0 w-1 h-full bg-chirurgical-red"></div>
<div class="flex justify-between items-start">
<div>
<h3 class="font-label-caps text-label-caps text-zinc-400 mb-1">THEORETICAL IMPACT</h3>
<div class="font-telemetry-lg text-telemetry-lg text-primary">FATIGUE DAMPING</div>
</div>
<div class="text-right">
<span class="material-symbols-outlined text-chirurgical-red">trending_up</span>
</div>
</div>
<div class="flex items-baseline gap-2">
<div class="font-headline-lg text-headline-lg text-primary" id="hud-value">-12.4</div>
<div class="font-telemetry-md text-telemetry-md text-zinc-400">% RECOVERY BOOST</div>
</div>
<div class="w-full bg-surface-container-high h-1 rounded-full overflow-hidden">
<div class="bg-chirurgical-red h-full w-[68%]" id="hud-bar"></div>
</div>
</section>
<!-- Reach Zone Inputs -->
<section class="reach-zone flex flex-col gap-6">
<!-- Sleep Stepper -->
<div class="flex flex-col gap-3">
<label class="font-label-caps text-label-caps text-zinc-400">SLEEP DURATION (HOURS)</label>
<div class="flex items-center justify-between glass-panel rounded-full p-2">
<button aria-label="Decrease Sleep" class="w-16 h-16 rounded-full flex items-center justify-center ghost-border text-primary hover:bg-glass-fill active:bg-surface-variant transition-colors" onclick="updateSleep(-0.5)">
<span class="material-symbols-outlined">remove</span>
</button>
<div class="font-telemetry-lg text-telemetry-lg text-primary w-24 text-center" id="sleep-val">7.5</div>
<button aria-label="Increase Sleep" class="w-16 h-16 rounded-full flex items-center justify-center ghost-border text-primary hover:bg-glass-fill active:bg-surface-variant transition-colors" onclick="updateSleep(0.5)">
<span class="material-symbols-outlined">add</span>
</button>
</div>
</div>
<!-- Caloric Status Selector -->
<div class="flex flex-col gap-3">
<label class="font-label-caps text-label-caps text-zinc-400">CALORIC STATUS</label>
<div class="grid grid-cols-3 gap-2">
<button class="py-4 glass-panel rounded-lg font-telemetry-md text-telemetry-md text-zinc-400 text-center uppercase active-state-selector" onclick="selectCaloric(this, 'deficit')">DEFICIT</button>
<button class="py-4 glass-panel rounded-lg font-telemetry-md text-telemetry-md text-primary text-center uppercase active-state-selector border-primary bg-glass-fill" onclick="selectCaloric(this, 'maintenance')">MAINTENANCE</button>
<button class="py-4 glass-panel rounded-lg font-telemetry-md text-telemetry-md text-zinc-400 text-center uppercase active-state-selector" onclick="selectCaloric(this, 'surplus')">SURPLUS</button>

<span class="material-symbols-outlined mb-1">biotech</span>
<span class="font-label-caps text-label-caps">LAB</span>
</button>

<script>
        // Simple Interaction Logic
        let currentSleep = 7.5;
        
        function updateSleep(delta) {
            currentSleep += delta;
            if(currentSleep < 0) currentSleep = 0;
            if(currentSleep > 24) currentSleep = 24;
            document.getElementById('sleep-val').innerText = currentSleep.toFixed(1);
            simulateCalculation();
        }

        function selectCaloric(btn, value) {
            document.querySelectorAll('.active-state-selector').forEach(el => {
                el.classList.remove('text-primary', 'border-primary', 'bg-glass-fill');
                el.classList.add('text-zinc-400');
            });
            btn.classList.remove('text-zinc-400');
            btn.classList.add('text-primary', 'border-primary', 'bg-glass-fill');
            simulateCalculation();
        }

        function selectStress(btn, value) {
            document.querySelectorAll('.active-stress-selector').forEach(el => {
                el.classList.remove('text-primary', 'border-primary', 'bg-glass-fill', 'text-chirurgical-red');
                el.classList.add('text-zinc-400');
            });
            btn.classList.remove('text-zinc-400');
            if(value === 'high') {
                btn.classList.add('text-chirurgical-red', 'border-chirurgical-red', 'bg-glass-fill');
            } else {
                btn.classList.add('text-primary', 'border-primary', 'bg-glass-fill');
            }
            simulateCalculation();
        }

        function simulateCalculation() {
            // Fake recalculation effect
            const hud = document.getElementById('hud-value');
            const bar = document.getElementById('hud-bar');
            hud.style.opacity = '0.5';
            
            setTimeout(() => {
                const randomVal = (Math.random() * -20).toFixed(1);
                hud.innerText = randomVal;
                hud.style.opacity = '1';
                bar.style.width = `${Math.abs(randomVal) * 4}%`;
            }, 300);
            
            // Haptic feedback placeholder
            if (navigator.vibrate) navigator.vibrate(10);
        }
    </script>
