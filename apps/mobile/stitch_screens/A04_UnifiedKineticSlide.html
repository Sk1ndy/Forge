<script>
  (function() {
    const container = document.getElementById('slide-to-validate-container');
    const handle = document.getElementById('slider-handle');
    const fill = document.getElementById('slider-fill');
    let isDragging = false;
    let startX = 0;
    const padding = 4; // Based on px-1 (4px)
    
    const updateMaxMove = () => {
        return container.clientWidth - handle.clientWidth - (padding * 2);
    };

    const onStart = (e) => {
      isDragging = true;
      startX = (e.pageX || e.touches[0].pageX) - (parseFloat(handle.style.transform.replace('translateX(', '')) || 0);
      handle.classList.remove('transition-transform');
      fill.classList.remove('transition-all');
    };

    const onMove = (e) => {
      if (!isDragging) return;
      const currentX = e.pageX || e.touches[0].pageX;
      let move = currentX - startX;
      const maxMove = updateMaxMove();
      move = Math.max(0, Math.min(move, maxMove));
      handle.style.transform = `translateX(${move}px)`;
      fill.style.width = `${move + (handle.clientWidth / 2) + padding}px`;
      
      if (move >= maxMove) {
        isDragging = false;
        handle.style.transform = `translateX(${maxMove}px)`;
        container.classList.add('bg-surgical-white/10');
        container.querySelector('span').classList.replace('text-zinc-400', 'text-surgical-white');
        container.querySelector('span').classList.replace('opacity-60', 'opacity-100');
        handle.style.opacity = '0.5';
        handle.style.pointerEvents = 'none';
      }
    };

    const onEnd = () => {
      if (!isDragging) return;
      isDragging = false;
      const move = parseFloat(handle.style.transform.replace('translateX(', '')) || 0;
      const maxMove = updateMaxMove();
      if (move < maxMove) {
        handle.classList.add('transition-transform');
        fill.classList.add('transition-all');
        handle.style.transform = 'translateX(0px)';
        fill.style.width = '0px';
      }
    };

    handle.addEventListener('mousedown', onStart);
    handle.addEventListener('touchstart', onStart);
    window.addEventListener('mousemove', onMove);
    window.addEventListener('touchmove', onMove);
    window.addEventListener('mouseup', onEnd);
    window.addEventListener('touchend', onEnd);
  })();
</script>

        // Simulating coordinate tracking on anatomical view

        const coordLabel = viewport.querySelector('.font-telemetry-md');
        
        viewport.addEventListener('mousemove', (e) => {
            const rect = viewport.getBoundingClientRect();
            const x = (e.clientX - rect.left).toFixed(1);
            const y = (e.clientY - rect.top).toFixed(1);
            coordLabel.innerHTML = `LOC_X: ${x}<br>LOC_Y: ${y}`;
        });
