<script>
        // Progress Circular Logic - Stochastic
        let progress = 0;
        const progressRing = document.getElementById('progress-ring');
        const progressText = document.getElementById('progress-text');
        
        // Circumference of r=126 circle is ~791.68
        const circumference = 2 * Math.PI * 126;

        let isWaitingForPayload = false;

        function updateProgress() {
            if (isWaitingForPayload) return;

            if (progress < 99) {
                // Stochastic burst logic
                let increment = 0;
                const r = Math.random();
                if (r > 0.9) {
                    increment = Math.random() * 8 + 4; // Burst
                } else if (r > 0.6) {
                    increment = Math.random() * 2 + 1; // Normal
                } else {
                    increment = 0; // Pause
                }

                // Pause briefly on critical nodes
                if (progress > 20 && progress < 25 && Math.random() > 0.8) increment = 0;
                if (progress > 50 && progress < 55 && Math.random() > 0.8) increment = 0;
                if (progress > 80 && progress < 85 && Math.random() > 0.8) increment = 0;


                progress += increment;
                if (progress > 99) progress = 99;
                
                const offset = circumference - (progress / 100) * circumference;
                progressRing.style.strokeDashoffset = offset;
                
                // Roll counter effect (simple implementation for DOM)
                progressText.innerText = `${Math.floor(progress)}%`;

                if (progress === 99) {
                    isWaitingForPayload = true;
                    setTimeout(() => {
                        // Simulate promise resolution
                        progress = 100;
                        const finalOffset = circumference - (progress / 100) * circumference;
                        progressRing.style.strokeDashoffset = finalOffset;
                        progressText.innerText = `100%`;
                        
                        // Flash on completion
                        progressRing.setAttribute('stroke', '#FFFFFF');
                        setTimeout(() => {
                            // Reset or transition
                            progressRing.setAttribute('stroke', '#EF4444');
                        }, 1000);

                    }, 2500 + Math.random() * 1500); // Wait 2.5-4s at 99%
                }

            }
            setTimeout(updateProgress, 100 + Math.random() * 200); // Stochastic intervals
        }

        setTimeout(updateProgress, 500);

        // Dynamic Log Stream (Split into corners) - Hyper-Personalized
        const logs = [
            "> ANALYZING 140.0KG SQUAT OVERLOAD MATRIX...",
            "> COMPUTING ADAPTIVE DELOAD FOR 4 SESSIONS/WEEK...",
            "> ADJUSTING TORQUE FOR FEMUR RATIO: LONG...",
            "> MAPPING ANATOMICAL POINTS FAIBLES...",
            "> SYNCHRONIZING CNS RECOVERY CONSTANTS...",
            "> CALIBRATING HYPERTROPHY THRESHOLDS...",
            "> MITOCHONDRIAL DENSITY PROJECTION...",
            "> KINETIC LOAD PROFILES COMPILING..."
        ];

        const logContainerTL = document.getElementById('log-container-tl');
        const logContainerBR = document.getElementById('log-container-br');
        
        let tlOffset = 0;
        let brOffset = 0;

        function addLog() {
            const logEntry = document.createElement('p');
            logEntry.className = "font-telemetry-md text-zinc-400 text-[9px] transition-colors duration-300 leading-tight whitespace-nowrap truncate text-surgical-white";
            logEntry.innerText = logs[Math.floor(Math.random() * logs.length)];
            
            // Randomly assign to top-left or bottom-right
            const isTL = Math.random() > 0.5;
            const targetContainer = isTL ? logContainerTL : logContainerBR;
            
            if (isTL) {
                targetContainer.appendChild(logEntry);
                tlOffset -= 14; // Approx height + spacing
                targetContainer.style.transform = `translateY(${tlOffset}px)`;
            } else {
                targetContainer.insertBefore(logEntry, targetContainer.firstChild);
                brOffset += 14;
                targetContainer.style.transform = `translateY(${brOffset}px)`;
            }

            if (targetContainer.children.length > 15) {
                if (isTL) targetContainer.removeChild(targetContainer.firstChild);
                else targetContainer.removeChild(targetContainer.lastChild);
            }
        }

        // Pre-fill some logs
        for(let i=0; i<6; i++) {
            const log1 = document.createElement('p');
            log1.className = "font-telemetry-md text-[9px] leading-tight whitespace-nowrap truncate text-surgical-white";
            log1.innerText = logs[Math.floor(Math.random() * logs.length)];
            logContainerTL.appendChild(log1);

            const log2 = document.createElement('p');
            log2.className = "font-telemetry-md text-[9px] leading-tight whitespace-nowrap truncate text-surgical-white";
            log2.innerText = logs[Math.floor(Math.random() * logs.length)];
            logContainerBR.appendChild(log2);
        }

        // Variable speed logging
        function triggerLog() {
            addLog();
            setTimeout(triggerLog, 200 + Math.random() * 800);
        }
        triggerLog();

        // Haptic Logic Emulation
        document.body.addEventListener('click', () => {
            document.body.style.transform = 'scale(0.995)';
            setTimeout(() => document.body.style.transform = 'scale(1)', 50);
        });
    </script>
