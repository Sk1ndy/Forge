name: CI - Forge Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run Vitest (Unit, Integration, Component)
      run: npm run test

    # Déjà présent : le test de régression mathématique 
    - name: Run Math Snapshot Regression Test
      run: npx tsx apps/web/src/scripts/generate_tests.ts && git diff --exit-code forge_tests_dataset.json
